services:
  postgres:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PG_TRICKLE_VERSION: "0.9.0"
        PG_TRICKLE_ARCH: linux-amd64
    image: pg-trickle-experiment:0.9.0
    container_name: pg-trickle-experiment-postgres
    environment:
      POSTGRES_DB: experiment
      POSTGRES_USER: experiment
      POSTGRES_PASSWORD: experiment
    ports:
      - "5433:5432"
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_trickle
      - -c
      - max_worker_processes=16
    volumes:
      - postgres-data:/var/lib/postgresql
      - ../sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U experiment -d experiment"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
