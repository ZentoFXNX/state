[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pg-trickle-main"
version = "0.1.0"
description = "Reproducible pg_trickle differential-versus-full refresh experiment"
requires-python = ">=3.14"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "matplotlib>=3.9,<4",
]

[project.scripts]
main = "main.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
